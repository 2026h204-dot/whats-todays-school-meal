<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>중앙예닮학교 월간 급식표</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen pb-16 antialiased">

  <div class="max-w-6xl mx-auto pt-10 px-4">
    
    <header class="text-center mb-8 border-b border-slate-200 pb-6">
      <span class="text-xs font-bold tracking-widest text-indigo-600 uppercase">Central Yedam School Meal System</span>
      <h1 class="text-3xl sm:text-4xl font-black text-slate-900 mt-2 tracking-tight">
        중앙예닮학교 월간 급식 대시보드
      </h1>
      <p class="text-xs text-slate-500 mt-2">한 달 치 조식·중식·석식을 한눈에 확인하세요</p>
    </header>

    <div class="bg-white border border-slate-200 p-4 rounded-2xl shadow-sm mb-8">
      <div class="flex justify-between items-center max-w-md mx-auto mb-4">
        <button id="prevMonthBtn" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold transition">
          ◀ 이전달
        </button>
        <span id="monthText" class="text-lg font-black text-slate-900"></span>
        <button id="nextMonthBtn" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold transition">
          다음달 ▶
        </button>
      </div>

      <div class="grid grid-cols-3 gap-2 text-center pt-3 border-t border-slate-100 text-xs">
        <div class="bg-emerald-50 border border-emerald-100 p-2 rounded-xl">
          <span class="font-extrabold text-emerald-700 block">조식</span>
          <span class="text-emerald-600 font-medium text-[11px]">07:30 ~ 07:50</span>
        </div>
        <div class="bg-indigo-50 border border-indigo-100 p-2 rounded-xl">
          <span class="font-extrabold text-indigo-700 block">중식</span>
          <span class="text-indigo-600 font-medium text-[11px]">12:00 ~ 12:50</span>
        </div>
        <div class="bg-purple-50 border border-purple-100 p-2 rounded-xl">
          <span class="font-extrabold text-purple-700 block">석식</span>
          <span class="text-purple-600 font-medium text-[11px]">17:00 ~ 18:00</span>
        </div>
      </div>
    </div>

    <main id="monthlyContainer" class="space-y-6">
      <div class="bg-white border border-slate-200 rounded-2xl p-16 text-center shadow-sm">
        <p class="text-sm font-bold text-slate-500">이번 달 급식 정보를 불러오는 중입니다...</p>
      </div>
    </main>

    <footer class="mt-16 text-center text-xs text-slate-400 font-medium">
      중앙예닮학교 급식 정보 서비스
    </footer>

  </div>

  <script>
    const OFFICE_CODE = "J10";
    const SCHOOL_CODE = "7531295";
    const API_KEY = "c18f1a26d702434190cb89c02059345c";

    let currentYearMonth = new Date(); // 현재 연/월 기준

    // 백업 월간 데이터 (API 미연동 대비)
    const BACKUP_MONTHLY = {
      "20260824": {
        "조식": "백미밥, 몽글계란국, 라구소스미트볼, 오이무침, 어묵볶음, 배추김치",
        "중식": "혼합잡곡밥, 미역냉국, 브로콜리땅콩소스, 김치제육*온두부, 깍두기, 앙꼬절편",
        "석식": "추가밥, 매운크림짬뽕, 꿀감자치즈롤까스, 배추김치, 오복지무침, 생과일"
      },
      "20260825": {
        "조식": "야채볶음밥, 베이글*크림치즈, 크림스프, 볶음김치, 사랑해사과c주스",
        "중식": "현미밥, 배추국, 훈제오리야채볶음, 건파래자반, 쌈무*소스, 깍두기",
        "석식": "혼합잡곡밥, 애호박찌개, 무말랭이무침, 치즈찜닭, 나초샐러드, 배추김치"
      },
      "20260826": {
        "조식": "백미밥, 김치찌개, 오이무침, 하트미니카츠, 삼치엿장조림, 배추김치",
        "중식": "산채비빔밥, 아욱된장국, 참나물오리엔탈무침, 셀프치킨또띠아, 파인애플, 배추김치",
        "석식": "귀리밥, 콩나물국, 매운돼지갈비찜, 미역줄기볶음, 오징어볼, 배추김치"
      },
      "20260827": {
        "조식": "미니밥, 핫케이크*시럽, 베이컨구이, 브로콜리갈릭오븐구이, 배추김치",
        "중식": "혼합잡곡밥, 소고기샤브샤브, 계란찜, 대구까스*치폴레소스, 배추김치",
        "석식": "스팸밥버거, 미소국, 매콤꼬치어묵, 블루베리샐러드, 짜요짜요, 깍두기"
      },
      "20260828": {
        "조식": "백미밥, 사골떡국, 닭살소금구이, 연두부냉채, 생과일, 배추김치",
        "중식": "투움바파스타, 오지치즈후라이, 목살스테이크, 야채피클, 청포도에이드",
        "석식": "백미밥, 등뼈감자탕&수제비, 오이고추무침, 멘치까스, 해물파전, 석박지"
      }
    };

    function cleanDishName(dishStr) {
      if (!dishStr) return "";
      return dishStr
        .replace(/<br\/>/g, ', ')
        .replace(/\([0-9.]+\)/g, '')
        .trim();
    }

    async function loadMonthlyData() {
      const container = document.getElementById('monthlyContainer');
      const monthText = document.getElementById('monthText');

      const year = currentYearMonth.getFullYear();
      const month = String(currentYearMonth.getMonth() + 1).padStart(2, '0');
      const ymStr = `${year}${month}`;

      monthText.innerText = `${year}년 ${currentYearMonth.getMonth() + 1}월 전체 식단`;

      container.innerHTML = `
        <div class="bg-white border border-slate-200 rounded-2xl p-16 text-center shadow-sm">
          <p class="text-sm font-bold text-slate-500">${year}년 ${currentYearMonth.getMonth() + 1}월 전체 급식 정보를 불러오는 중입니다...</p>
        </div>
      `;

      // 한 달 치 데이터를 날짜 파라미터(MLSV_YMD) 없이 연월(MLSV_FROM_YMD ~ MLSV_TO_YMD)로 한 번에 요청
      const lastDay = new Date(year, currentYearMonth.getMonth() + 1, 0).getDate();
      const fromYmd = `${ymStr}01`;
      const toYmd = `${ymStr}${String(lastDay).padStart(2, '0')}`;

      const url = `https://open.neis.go.kr/hub/mealServiceDietInfo?KEY=${API_KEY}&Type=json&ATPT_OFCDC_SC_CODE=${OFFICE_CODE}&SD_SCHUL_CODE=${SCHOOL_CODE}&MLSV_FROM_YMD=${fromYmd}&MLSV_TO_YMD=${toYmd}`;

      let dailyMap = {};

      try {
        const res = await fetch(url);
        const data = await res.json();
        
        if (data.mealServiceDietInfo && data.mealServiceDietInfo[1]?.row) {
          const rows = data.mealServiceDietInfo[1].row;
          rows.forEach(r => {
            const dateKey = r.MLSV_YMD;
            if (!dailyMap[dateKey]) dailyMap[dateKey] = {};
            dailyMap[dateKey][r.MMEAL_SC_NM] = cleanDishName(r.DDISH_NM);
          });
        }
      } catch (e) {
        // API 연동 문제 시 백업 월간 데이터 활용
        dailyMap = BACKUP_MONTHLY;
      }

      if (Object.keys(dailyMap).length === 0) {
        dailyMap = BACKUP_MONTHLY;
      }

      const dateKeys = Object.keys(dailyMap).sort();

      if (dateKeys.length > 0) {
        container.innerHTML = dateKeys.map(dateKey => {
          const y = dateKey.substring(0, 4);
          const m = parseInt(dateKey.substring(4, 6));
          const d = parseInt(dateKey.substring(6, 8));
          const dateObj = new Date(y, m - 1, d);
          const dayNames = ['일', '월', '화', '수', '목', '금', '토'];
          const dayName = dayNames[dateObj.getDay()];

          const meals = dailyMap[dateKey];
          const breakfast = meals["조식"] || "식단 정보가 없습니다.";
          const lunch = meals["중식"] || "식단 정보가 없습니다.";
          const dinner = meals["석식"] || "식단 정보가 없습니다.";

          return `
            <div class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm">
              <div class="mb-3 pb-2 border-b border-slate-100 flex justify-between items-center">
                <span class="text-base font-black text-slate-900">${y}년 ${m}월 ${d}일 (${dayName})</span>
                <span class="text-xs text-indigo-600 font-bold bg-indigo-50 px-2.5 py-1 rounded-lg">전체 식단</span>
              </div>

              <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                <div class="bg-slate-50 p-3 rounded-xl border border-slate-100">
                  <span class="text-xs font-bold text-emerald-700 bg-emerald-100 px-2 py-0.5 rounded">조식</span>
                  <p class="text-xs text-slate-700 mt-2 leading-relaxed font-medium">${breakfast}</p>
                </div>

                <div class="bg-slate-50 p-3 rounded-xl border border-slate-100">
                  <span class="text-xs font-bold text-indigo-700 bg-indigo-100 px-2 py-0.5 rounded">중식</span>
                  <p class="text-xs text-slate-700 mt-2 leading-relaxed font-medium">${lunch}</p>
                </div>

                <div class="bg-slate-50 p-3 rounded-xl border border-slate-100">
                  <span class="text-xs font-bold text-purple-700 bg-purple-100 px-2 py-0.5 rounded">석식</span>
                  <p class="text-xs text-slate-700 mt-2 leading-relaxed font-medium">${dinner}</p>
                </div>
              </div>
            </div>
          `;
        }).join('');
      } else {
        container.innerHTML = `
          <div class="bg-white border border-slate-200 rounded-2xl p-16 text-center shadow-sm">
            <h3 class="text-base font-bold text-slate-800">해당 월의 등록된 급식 정보가 없습니다</h3>
          </div>
        `;
      }
    }

    document.getElementById('prevMonthBtn').addEventListener('click', () => {
      currentYearMonth.setMonth(currentYearMonth.getMonth() - 1);
      loadMonthlyData();
    });

    document.getElementById('nextMonthBtn').addEventListener('click', () => {
      currentYearMonth.setMonth(currentYearMonth.getMonth() + 1);
      loadMonthlyData();
    });

    loadMonthlyData();
  </script>
</body>
</html>
