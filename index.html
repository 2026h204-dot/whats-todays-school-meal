<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>중앙예닮학교 오늘의 급식</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen pb-16 antialiased">

  <div class="max-w-6xl mx-auto pt-10 px-4">
    
    <header class="text-center mb-8 border-b border-slate-200 pb-6">
      <span class="text-xs font-bold tracking-widest text-indigo-600 uppercase">Central Yedam School Meal System</span>
      <h1 class="text-3xl sm:text-4xl font-black text-slate-900 mt-2 tracking-tight">
        중앙예닮학교 급식 대시보드
      </h1>
      <p class="text-xs text-slate-500 mt-2">실시간 학식 안내 서비스</p>
    </header>

    <div class="max-w-md mx-auto flex justify-between items-center bg-white border border-slate-200 p-3 rounded-2xl shadow-sm mb-8">
      <button id="prevBtn" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold transition">
        ◀ 이전날
      </button>
      <div class="text-center">
        <span id="dateText" class="text-base font-black text-slate-900 block"></span>
        <button id="todayBtn" class="text-[11px] text-indigo-600 hover:underline font-bold mt-0.5 hidden">
          오늘 날짜로 이동
        </button>
      </div>
      <button id="nextBtn" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold transition">
        다음날 ▶
      </button>
    </div>

    <main id="mealContainer" class="w-full">
      <div class="bg-white border border-slate-200 rounded-2xl p-16 text-center shadow-sm">
        <p class="text-sm font-bold text-slate-500">급식 정보를 불러오는 중입니다...</p>
      </div>
    </main>

    <footer class="mt-16 text-center text-xs text-slate-400 font-medium">
      중앙예닮학교 급식 정보 서비스
    </footer>

  </div>

  <script>
    const OFFICE_CODE = "J10";
    const SCHOOL_CODE = "7531295";
    const API_KEY = "c18f1a26d702434190cb89c02059345c";

    let currentDate = new Date();

    const MEAL_CONFIG = {
      "조식": { time: "07:30 ~ 07:50", badge: "border-emerald-200 bg-emerald-50 text-emerald-700" },
      "중식": { time: "12:00 ~ 12:50", badge: "border-indigo-200 bg-indigo-50 text-indigo-700" },
      "석식": { time: "17:00 ~ 18:00", badge: "border-purple-200 bg-purple-50 text-purple-700" }
    };

    // 내장 데이터베이스 (API 네트워크 차단 시 실행되는 백업 데이터)
    const BACKUP_DATABASE = {
      "20260824": [
        { MMEAL_SC_NM: "조식", CAL_INFO: "606.7 Kcal", DDISH_NM: "백미밥<br/>몽글계란국<br/>라구소스미트볼<br/>오이무침<br/>어묵볶음<br/>배추김치" },
        { MMEAL_SC_NM: "중식", CAL_INFO: "937.6 Kcal", DDISH_NM: "혼합잡곡밥<br/>미역냉국<br/>브로콜리땅콩소스<br/>김치제육*온두부<br/>깍두기<br/>앙꼬절편" },
        { MMEAL_SC_NM: "석식", CAL_INFO: "958.8 Kcal", DDISH_NM: "추가밥<br/>매운크림짬뽕<br/>꿀감자치즈롤까스<br/>배추김치<br/>오복지무침<br/>생과일" }
      ],
      "20260825": [
        { MMEAL_SC_NM: "조식", CAL_INFO: "884.8 Kcal", DDISH_NM: "야채볶음밥<br/>베이글*크림치즈<br/>크림스프<br/>볶음김치<br/>사랑해사과c주스" },
        { MMEAL_SC_NM: "중식", CAL_INFO: "720.6 Kcal", DDISH_NM: "현미밥<br/>배추국<br/>훈제오리야채볶음<br/>건파래자반<br/>쌈무*소스<br/>깍두기" },
        { MMEAL_SC_NM: "석식", CAL_INFO: "801.0 Kcal", DDISH_NM: "혼합잡곡밥<br/>애호박찌개<br/>무말랭이무침<br/>치즈찜닭<br/>나초샐러드<br/>배추김치" }
      ],
      "20260826": [
        { MMEAL_SC_NM: "조식", CAL_INFO: "822.6 Kcal", DDISH_NM: "백미밥<br/>김치찌개<br/>오이무침<br/>하트미니카츠<br/>삼치엿장조림<br/>배추김치" },
        { MMEAL_SC_NM: "중식", CAL_INFO: "740.5 Kcal", DDISH_NM: "산채비빔밥<br/>아욱된장국<br/>참나물오리엔탈무침<br/>셀프치킨또띠아<br/>파인애플<br/>배추김치" },
        { MMEAL_SC_NM: "석식", CAL_INFO: "799.8 Kcal", DDISH_NM: "귀리밥<br/>콩나물국<br/>매운돼지갈비찜<br/>미역줄기볶음<br/>오징어볼<br/>배추김치" }
      ],
      "20260827": [
        { MMEAL_SC_NM: "조식", CAL_INFO: "647.9 Kcal", DDISH_NM: "미니밥<br/>핫케이크*시럽<br/>베이컨구이<br/>브로콜리갈릭오븐구이<br/>배추김치" },
        { MMEAL_SC_NM: "중식", CAL_INFO: "595.2 Kcal", DDISH_NM: "혼합잡곡밥<br/>소고기샤브샤브<br/>계란찜<br/>대구까스*치폴레소스<br/>배추김치" },
        { MMEAL_SC_NM: "석식", CAL_INFO: "670.9 Kcal", DDISH_NM: "스팸밥버거<br/>미소국<br/>매콤꼬치어묵<br/>블루베리샐러드<br/>짜요짜요<br/>깍두기" }
      ],
      "20260828": [
        { MMEAL_SC_NM: "조식", CAL_INFO: "671.5 Kcal", DDISH_NM: "백미밥<br/>사골떡국<br/>닭살소금구이<br/>연두부냉채<br/>생과일<br/>배추김치" },
        { MMEAL_SC_NM: "중식", CAL_INFO: "745.2 Kcal", DDISH_NM: "투움바파스타<br/>오지치즈후라이<br/>목살스테이크<br/>야채피클<br/>청포도에이드" },
        { MMEAL_SC_NM: "석식", CAL_INFO: "792.0 Kcal", DDISH_NM: "백미밥<br/>등뼈감자탕&수제비<br/>오이고추무침<br/>멘치까스<br/>해물파전<br/>석박지" }
      ]
    };

    function formatDateStr(d) {
      const year = d.getFullYear();
      const month = d.getMonth() + 1;
      const date = d.getDate();
      const dayNames = ['일', '월', '화', '수', '목', '금', '토'];
      return `${year}년 ${month}월 ${date}일 (${dayNames[d.getDay()]})`;
    }

    function parseMenu(dishStr) {
      if (!dishStr) return [];
      return dishStr.split('<br/>').map(item => {
        const cleanName = item.replace(/\([0-9.]+\)/g, '').trim();
        const allergyMatches = item.match(/\([0-9.]+\)/g);
        return {
          name: cleanName,
          allergy: allergyMatches ? allergyMatches.join(' ') : ''
        };
      }).filter(item => item.name.length > 0);
    }

    function generateSummary(menuList) {
      if (!menuList || menuList.length === 0) return "상세 메뉴 정보가 없습니다.";
      const names = menuList.map(m => m.name);
      const mains = names.filter(n => n.includes("고기") || n.includes("갈비") || n.includes("제육") || n.includes("스테이크") || n.includes("닭") || n.includes("치킨") || n.includes("까스") || n.includes("파스타") || n.includes("찌개") || n.includes("탕") || n.includes("찜") || n.includes("오리"));
      const text = mains.length > 0 ? mains.join(', ') : names.slice(0, 2).join(', ');
      return `오늘의 메인 식단: <strong>${text}</strong>`;
    }

    async function loadMealData() {
      const container = document.getElementById('mealContainer');
      const dateText = document.getElementById('dateText');
      const todayBtn = document.getElementById('todayBtn');

      dateText.innerText = formatDateStr(currentDate);

      const isToday = currentDate.toDateString() === new Date().toDateString();
      todayBtn.classList.toggle('hidden', isToday);

      const year = currentDate.getFullYear();
      const month = String(currentDate.getMonth() + 1).padStart(2, '0');
      const day = String(currentDate.getDate()).padStart(2, '0');
      const yyyymmdd = `${year}${month}${day}`;

      let meals = [];

      // API 호출 시도 및 실패 시 내장 데이터베이스 사용
      try {
        const url = `https://open.neis.go.kr/hub/mealServiceDietInfo?KEY=${API_KEY}&Type=json&ATPT_OFCDC_SC_CODE=${OFFICE_CODE}&SD_SCHUL_CODE=${SCHOOL_CODE}&MLSV_YMD=${yyyymmdd}`;
        const res = await fetch(url);
        const data = await res.json();
        if (data.mealServiceDietInfo && data.mealServiceDietInfo[1]?.row) {
          meals = data.mealServiceDietInfo[1].row;
        } else {
          meals = BACKUP_DATABASE[yyyymmdd] || [];
        }
      } catch (e) {
        meals = BACKUP_DATABASE[yyyymmdd] || [];
      }

      if (meals && meals.length > 0) {
        container.innerHTML = `
          <div class="grid grid-cols-1 md:grid-cols-3 gap-6 w-full">
            ${meals.map(meal => {
              const config = MEAL_CONFIG[meal.MMEAL_SC_NM] || {
                time: "배식 안내",
                badge: "border-slate-200 bg-slate-100 text-slate-700"
              };
              const menuList = parseMenu(meal.DDISH_NM);
              const summary = generateSummary(menuList);

              return `
                <div class="bg-white border border-slate-200 rounded-2xl p-6 flex flex-col justify-between shadow-sm hover:shadow-md transition">
                  <div>
                    <div class="flex justify-between items-start mb-4 pb-4 border-b border-slate-100">
                      <div>
                        <span class="inline-block px-3 py-1 rounded-lg border text-xs font-extrabold ${config.badge}">
                          ${meal.MMEAL_SC_NM}
                        </span>
                        <span class="block text-xs text-slate-500 mt-2 font-semibold">배식시간: ${config.time}</span>
                      </div>
                      <div class="text-right">
                        <span class="text-xs text-slate-400 font-bold block">총 열량</span>
                        <span class="text-sm font-black text-slate-800">${meal.CAL_INFO}</span>
                      </div>
                    </div>

                    <div class="space-y-2 mb-6">
                      <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider block mb-1">식단 구성</span>
                      ${menuList.map(item => `
                        <div class="flex justify-between items-center py-1.5 border-b border-slate-50 last:border-none">
                          <span class="text-sm font-bold text-slate-700">${item.name}</span>
                          ${item.allergy ? `<span class="text-[10px] text-slate-400 bg-slate-100 px-1.5 py-0.5 rounded font-mono">${item.allergy}</span>` : ''}
                        </div>
                      `).join('')}
                    </div>
                  </div>

                  <div class="mt-4 pt-4 border-t border-slate-100 bg-slate-50/80 p-3.5 rounded-xl border border-slate-100">
                    <span class="text-[11px] font-bold text-indigo-600 block mb-1">식단 요약</span>
                    <p class="text-xs text-slate-600 leading-relaxed">${summary}</p>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;
      } else {
        container.innerHTML = `
          <div class="bg-white border border-slate-200 rounded-2xl p-16 text-center shadow-sm">
            <h3 class="text-base font-bold text-slate-800">등록된 급식 정보가 없습니다</h3>
            <p class="text-xs text-slate-500 mt-2">${formatDateStr(currentDate)}은 급식 데이터가 존재하지 않는 날짜입니다.</p>
          </div>
        `;
      }
    }

    document.getElementById('prevBtn').addEventListener('click', () => {
      currentDate.setDate(currentDate.getDate() - 1);
      loadMealData();
    });

    document.getElementById('nextBtn').addEventListener('click', () => {
      currentDate.setDate(currentDate.getDate() + 1);
      loadMealData();
    });

    document.getElementById('todayBtn').addEventListener('click', () => {
      currentDate = new Date();
      loadMealData();
    });

    // 실행
    loadMealData();
  </script>
</body>
</html>
