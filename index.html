```html
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>오늘의 급식표</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>

<body class="bg-slate-100 min-h-screen">

  <div class="max-w-xl mx-auto px-4 py-8">

    <!-- 헤더 -->
    <header class="mb-6">
      <div class="flex items-center justify-between">

        <div>
          <p class="text-sm font-bold text-indigo-600 mb-1">
            SCHOOL MEAL
          </p>

          <h1 class="text-3xl font-black text-slate-900">
            🍱 오늘의 급식
          </h1>

          <p id="schoolName"
             class="text-sm text-slate-500 font-semibold mt-2">
            학교를 선택해주세요
          </p>
        </div>

        <button
          onclick="openSchoolSearch()"
          class="bg-white border border-slate-200 shadow-sm
                 hover:bg-slate-50 transition
                 rounded-2xl px-4 py-3
                 text-sm font-bold text-slate-700">
          학교 변경
        </button>

      </div>
    </header>


    <!-- 날짜 선택 -->
    <section class="bg-white rounded-3xl shadow-sm border border-slate-200 p-4 mb-5">

      <div class="flex items-center justify-between">

        <button
          onclick="changeDate(-1)"
          class="w-11 h-11 rounded-2xl bg-slate-100
                 hover:bg-slate-200 transition text-lg">
          ‹
        </button>

        <div class="text-center">

          <p id="dateLabel"
             class="text-lg font-black text-slate-900">
            날짜 불러오는 중
          </p>

          <button
            onclick="setToday()"
            class="text-xs font-bold text-indigo-600 mt-1">
            오늘로 이동
          </button>

        </div>

        <button
          onclick="changeDate(1)"
          class="w-11 h-11 rounded-2xl bg-slate-100
                 hover:bg-slate-200 transition text-lg">
          ›
        </button>

      </div>

    </section>


    <!-- 급식 -->
    <main id="mealContainer">

      <div class="bg-white rounded-3xl p-8 text-center
                  border border-slate-200 shadow-sm">

        <p class="text-slate-400 font-bold">
          먼저 학교를 선택해주세요.
        </p>

        <button
          onclick="openSchoolSearch()"
          class="mt-4 bg-indigo-600 text-white
                 px-5 py-3 rounded-2xl
                 font-bold text-sm
                 hover:bg-indigo-700 transition">
          학교 검색
        </button>

      </div>

    </main>


    <!-- 하단 -->
    <footer class="text-center mt-6 text-xs text-slate-400 font-semibold">
      나이스 교육정보 개방포털 급식 API
      <span id="lastUpdated"></span>
    </footer>

  </div>


  <!-- =========================
       학교 검색 모달
  ========================== -->

  <div
    id="schoolModal"
    class="hidden fixed inset-0 z-50 bg-black/40
           backdrop-blur-sm px-4 py-8 overflow-y-auto">

    <div class="max-w-xl mx-auto bg-white rounded-3xl shadow-2xl p-5">

      <div class="flex items-center justify-between mb-5">

        <div>
          <h2 class="text-xl font-black text-slate-900">
            학교 검색
          </h2>

          <p class="text-xs text-slate-400 mt-1">
            학교 이름을 입력하세요.
          </p>
        </div>

        <button
          onclick="closeSchoolSearch()"
          class="w-10 h-10 rounded-xl bg-slate-100
                 text-slate-500 font-bold">
          ✕
        </button>

      </div>


      <!-- 검색창 -->
      <div class="flex gap-2">

        <input
          id="schoolSearchInput"
          type="text"
          placeholder="예: 예닮고등학교"
          class="flex-1 border border-slate-200
                 rounded-2xl px-4 py-3
                 outline-none
                 focus:ring-2 focus:ring-indigo-500"
          onkeydown="if(event.key === 'Enter') searchSchools()"
        >

        <button
          onclick="searchSchools()"
          class="bg-indigo-600 text-white
                 px-5 rounded-2xl font-bold
                 hover:bg-indigo-700 transition">
          검색
        </button>

      </div>


      <!-- 검색 결과 -->
      <div
        id="schoolResults"
        class="mt-4 space-y-2">
      </div>

    </div>

  </div>


<script>

  /* =====================================================
     ⚙️ 설정
  ===================================================== */

  // 나이스 API 인증키를 입력하세요.
  const NEIS_API_KEY = 86ddda2646244621a6496fa96c3a5311;


  /* =====================================================
     상태
  ===================================================== */

  let selectedSchool = null;

  let selectedDate = new Date();


  /* =====================================================
     초기화
  ===================================================== */

  window.addEventListener("DOMContentLoaded", () => {

    loadSavedSchool();

    updateDateLabel();

  });


  /* =====================================================
     날짜
  ===================================================== */

  function formatDate(date) {

    const year = date.getFullYear();

    const month = String(
      date.getMonth() + 1
    ).padStart(2, "0");

    const day = String(
      date.getDate()
    ).padStart(2, "0");

    return `${year}-${month}-${day}`;

  }


  function formatApiDate(date) {

    const year = date.getFullYear();

    const month = String(
      date.getMonth() + 1
    ).padStart(2, "0");

    const day = String(
      date.getDate()
    ).padStart(2, "0");

    return `${year}${month}${day}`;

  }


  function formatKoreanDate(date) {

    const year = date.getFullYear();

    const month = date.getMonth() + 1;

    const day = date.getDate();

    const weekdays = [
      "일",
      "월",
      "화",
      "수",
      "목",
      "금",
      "토"
    ];

    const weekday =
      weekdays[date.getDay()];

    return `${year}년 ${month}월 ${day}일 (${weekday})`;

  }


  function updateDateLabel() {

    document.getElementById(
      "dateLabel"
    ).textContent =
      formatKoreanDate(selectedDate);

  }


  function changeDate(amount) {

    selectedDate.setDate(
      selectedDate.getDate() + amount
    );

    updateDateLabel();

    if (selectedSchool) {
      fetchMealData();
    }

  }


  function setToday() {

    selectedDate = new Date();

    updateDateLabel();

    if (selectedSchool) {
      fetchMealData();
    }

  }


  /* =====================================================
     학교 검색 모달
  ===================================================== */

  function openSchoolSearch() {

    document
      .getElementById("schoolModal")
      .classList.remove("hidden");

    setTimeout(() => {

      document
        .getElementById("schoolSearchInput")
        .focus();

    }, 100);

  }


  function closeSchoolSearch() {

    document
      .getElementById("schoolModal")
      .classList.add("hidden");

  }


  /* =====================================================
     학교 검색
  ===================================================== */

  async function searchSchools() {

    const input =
      document
        .getElementById("schoolSearchInput")
        .value
        .trim();

    const results =
      document.getElementById("schoolResults");


    if (!input) {

      results.innerHTML = `
        <div class="p-5 text-center text-sm
                    text-slate-400 font-semibold">
          학교 이름을 입력해주세요.
        </div>
      `;

      return;

    }


    if (
      !NEIS_API_KEY ||
      NEIS_API_KEY.includes("여기에_")
    ) {

      results.innerHTML = `
        <div class="bg-red-50 border border-red-200
                    rounded-2xl p-5 text-sm">
          <p class="font-black text-red-600">
            나이스 API 인증키가 필요합니다.
          </p>

          <p class="text-red-500 mt-1">
            코드 상단의 NEIS_API_KEY에
            발급받은 인증키를 입력해주세요.
          </p>
        </div>
      `;

      return;

    }


    results.innerHTML = `
      <div class="p-6 text-center text-sm
                  text-slate-400 loading">
        학교를 검색하는 중...
      </div>
    `;


    try {

      const url =
        `https://open.neis.go.kr/hub/schoolInfo` +
        `?KEY=${encodeURIComponent(NEIS_API_KEY)}` +
        `&Type=json` +
        `&pIndex=1` +
        `&pSize=100` +
        `&SCHUL_NM=${encodeURIComponent(input)}`;


      const response =
        await fetch(url);


      const data =
        await response.json();


      console.log(
        "학교 검색 API 응답:",
        data
      );


      if (!response.ok) {

        throw new Error(
          `HTTP ${response.status}`
        );

      }


      if (!data.schoolInfo) {

        const resultCode =
          data.RESULT?.CODE ||
          "UNKNOWN";

        const resultMessage =
          data.RESULT?.MESSAGE ||
          "검색 결과가 없습니다.";


        results.innerHTML = `
          <div class="p-6 text-center">

            <p class="font-bold text-slate-600">
              학교를 찾지 못했습니다.
            </p>

            <p class="text-xs text-slate-400 mt-2">
              ${resultCode}: ${resultMessage}
            </p>

          </div>
        `;

        return;

      }


      const rows =
        data.schoolInfo[1]?.row || [];


      if (rows.length === 0) {

        results.innerHTML = `
          <div class="p-6 text-center
                      text-slate-400 font-semibold">
            검색 결과가 없습니다.
          </div>
        `;

        return;

      }


      results.innerHTML = "";


      rows.forEach((school) => {

        const button =
          document.createElement("button");


        button.className =
          `
          w-full text-left
          border border-slate-200
          hover:border-indigo-400
          hover:bg-indigo-50
          rounded-2xl p-4
          transition
          `;


        button.innerHTML =
          `
          <div class="font-black text-slate-900">
            ${escapeHtml(school.SCHUL_NM)}
          </div>

          <div class="text-xs text-slate-500 mt-1">
            ${escapeHtml(school.ATPT_OFCDC_SC_NM || "")}
            ·
            ${escapeHtml(school.SCHUL_KND_SC_NM || "")}
          </div>

          <div class="text-xs text-slate-400 mt-1">
            ${escapeHtml(school.ORG_RDNMA || "")}
          </div>
          `;


        button.onclick =
          () => selectSchool(school);


        results.appendChild(button);

      });

    }

    catch (error) {

      console.error(
        "학교 검색 오류:",
        error
      );


      results.innerHTML = `
        <div class="bg-red-50
                    border border-red-200
                    rounded-2xl p-5">

          <p class="font-black text-red-600">
            학교 검색에 실패했습니다.
          </p>

          <p class="text-xs text-red-400 mt-1">
            ${escapeHtml(error.message)}
          </p>

          <p class="text-xs text-red-400 mt-2">
            브라우저 콘솔(F12)에서도
            자세한 오류를 확인할 수 있습니다.
          </p>

        </div>
      `;

    }

  }


  /* =====================================================
     학교 선택
  ===================================================== */

  function selectSchool(school) {

    selectedSchool = {

      name: school.SCHUL_NM,

      officeCode:
        school.ATPT_OFCDC_SC_CODE,

      schoolCode:
        school.SD_SCHUL_CODE,

      kind:
        school.SCHUL_KND_SC_NM,

      address:
        school.ORG_RDNMA

    };


    localStorage.setItem(
      "selectedSchool",
      JSON.stringify(selectedSchool)
    );


    document.getElementById(
      "schoolName"
    ).textContent =
      `${selectedSchool.name} · ${selectedSchool.kind || ""}`;


    closeSchoolSearch();

    fetchMealData();

  }


  /* =====================================================
     저장된 학교 불러오기
  ===================================================== */

  function loadSavedSchool() {

    try {

      const saved =
        localStorage.getItem(
          "selectedSchool"
        );


      if (!saved) return;


      selectedSchool =
        JSON.parse(saved);


      document.getElementById(
        "schoolName"
      ).textContent =
        `${selectedSchool.name} · ${selectedSchool.kind || ""}`;


      fetchMealData();

    }

    catch (error) {

      console.error(
        "저장된 학교 불러오기 실패:",
        error
      );

    }

  }


  /* =====================================================
     급식 데이터
  ===================================================== */

  async function fetchMealData() {

    const container =
      document.getElementById(
        "mealContainer"
      );


    if (!selectedSchool) {

      return;

    }


    container.innerHTML = `
      <div class="bg-white rounded-3xl
                  border border-slate-200
                  p-10 text-center">

        <div class="loading
                    text-indigo-500
                    font-bold">
          급식 정보를 불러오는 중...
        </div>

      </div>
    `;


    const apiDate =
      formatApiDate(selectedDate);


    try {

      const url =
        `https://open.neis.go.kr/hub/mealServiceDietInfo` +
        `?KEY=${encodeURIComponent(NEIS_API_KEY)}` +
        `&Type=json` +
        `&pIndex=1` +
        `&pSize=100` +
        `&ATPT_OFCDC_SC_CODE=${encodeURIComponent(selectedSchool.officeCode)}` +
        `&SD_SCHUL_CODE=${encodeURIComponent(selectedSchool.schoolCode)}` +
        `&MLSV_YMD=${apiDate}`;


      const response =
        await fetch(url);


      const data =
        await response.json();


      console.log(
        "급식 API 응답:",
        data
      );


      if (!response.ok) {

        throw new Error(
          `HTTP ${response.status}`
        );

      }


      if (!data.mealServiceDietInfo) {

        const resultCode =
          data.RESULT?.CODE || "";


        const resultMessage =
          data.RESULT?.MESSAGE ||
          "급식 정보가 없습니다.";


        renderNoMeal(
          resultCode,
          resultMessage
        );

        return;

      }


      const rows =
        data.mealServiceDietInfo[1]?.row || [];


      if (rows.length === 0) {

        renderNoMeal(
          "",
          "해당 날짜에는 등록된 급식이 없습니다."
        );

        return;

      }


      renderMeals(rows);


      const now =
        new Date();


      document.getElementById(
        "lastUpdated"
      ).textContent =
        ` · ${now.getHours()}:${String(
          now.getMinutes()
        ).padStart(2, "0")} 갱신`;

    }

    catch (error) {

      console.error(
        "급식 API 오류:",
        error
      );


      container.innerHTML = `
        <div class="bg-red-50
                    border border-red-200
                    rounded-3xl p-7">

          <p class="text-red-600
                    font-black text-lg">
            급식 정보를 불러오지 못했습니다.
          </p>

          <p class="text-red-500
                    text-sm mt-2">
            ${escapeHtml(error.message)}
          </p>

          <p class="text-red-400
                    text-xs mt-3">
            개발자 콘솔(F12)에서
            API 응답을 확인할 수 있습니다.
          </p>

        </div>
      `;

    }

  }


  /* =====================================================
     급식 렌더링
  ===================================================== */

  function renderMeals(rows) {

    const container =
      document.getElementById(
        "mealContainer"
      );


    container.innerHTML = "";


    const mealOrder = {
      "조식": 1,
      "중식": 2,
      "석식": 3
    };


    rows.sort(
      (a, b) =>
        (mealOrder[a.MMEAL_SC_NM] || 99) -
        (mealOrder[b.MMEAL_SC_NM] || 99)
    );


    rows.forEach((meal) => {

      const mealType =
        meal.MMEAL_SC_NM ||
        "급식";


      const menu =
        meal.DDISH_NM ||
        "";


      const foods =
        parseMenu(menu);


      const wrapper =
        document.createElement("section");


      wrapper.className =
        `
        meal-card
        bg-white
        border border-slate-200
        rounded-3xl
        shadow-sm
        overflow-hidden
        mb-4
        `;


      wrapper.innerHTML =
        `
        <div class="px-5 py-4
                    border-b border-slate-100
                    flex items-center justify-between">

          <div>

            <span class="text-xs
                         font-black
                         text-indigo-600">
              ${getMealEmoji(mealType)}
            </span>

            <h2 class="inline ml-2
                       text-lg font-black
                       text-slate-900">
              ${escapeHtml(mealType)}
            </h2>

          </div>

          <span class="text-xs
                       text-slate-400
                       font-bold">
            ${foods.length}가지 메뉴
          </span>

        </div>


        <div class="p-4 space-y-2">

          ${foods.map(food => `

            <div class="flex items-center
                        gap-3
                        bg-slate-50
                        rounded-2xl
                        px-4 py-3">

              <span class="w-2 h-2
                           rounded-full
                           bg-indigo-500
                           flex-shrink-0">
              </span>

              <span class="font-bold
                           text-slate-700
                           text-sm
                           leading-relaxed">
                ${escapeHtml(food.name)}
              </span>

              ${
                food.allergies.length
                ?
                `
                <span class="ml-auto
                             text-[10px]
                             font-black
                             text-amber-600
                             bg-amber-50
                             px-2 py-1
                             rounded-lg
                             whitespace-nowrap">
                  알레르기 ${food.allergies.join(", ")}
                </span>
                `
                :
                ""
              }

            </div>

          `).join("")}

        </div>
        `;


      container.appendChild(wrapper);

    });

  }


  /* =====================================================
     메뉴 파싱
  ===================================================== */

  function parseMenu(raw) {

    return raw
      .replace(/<br\s*\/?>/gi, "\n")
      .split("\n")
      .map(item => item.trim())
      .filter(Boolean)
      .map(item => {

        const allergies = [];

        const matches =
          item.match(/\(([\d.]+)\)/g);


        if (matches) {

          matches.forEach(match => {

            const numbers =
              match
                .replace(/[()]/g, "")
                .split(".")
                .filter(Boolean);


            numbers.forEach(number => {

              if (!allergies.includes(number)) {
                allergies.push(number);
              }

            });

          });

        }


        const cleanName =
          item
            .replace(/\([\d.]+\)/g, "")
            .trim();


        return {

          name: cleanName,

          allergies

        };

      });

  }


  /* =====================================================
     급식 없음
  ===================================================== */

  function renderNoMeal(code, message) {

    const container =
      document.getElementById(
        "mealContainer"
      );


    container.innerHTML =
      `
      <div class="bg-white
                  border border-slate-200
                  rounded-3xl
                  p-8 text-center
                  shadow-sm">

        <div class="text-4xl mb-4">
          🍽️
        </div>

        <h2 class="font-black
                   text-slate-800
                   text-lg">
          급식이 없습니다
        </h2>

        <p class="text-sm
                  text-slate-400
                  mt-2">
          ${escapeHtml(message)}
        </p>

        ${
          code
          ?
          `
          <p class="text-[10px]
                    text-slate-300
                    mt-3">
            ${escapeHtml(code)}
          </p>
          `
          :
          ""
        }

      </div>
      `;

  }


  /* =====================================================
     이모지
  ===================================================== */

  function getMealEmoji(type) {

    if (type === "조식") return "🌅";

    if (type === "중식") return "☀️";

    if (type === "석식") return "🌙";

    return "🍴";

  }


  /* =====================================================
     XSS 방지
  ===================================================== */

  function escapeHtml(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }

</script>

</body>
</html>
```
