<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>중앙예닮학교 오늘의 급식</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & React DOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel Standalone -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body class="bg-slate-100 text-slate-800 font-sans pb-16 antialiased">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect } = React;

      const SCHOOL_NAME = "중앙예닮학교";
      const OFFICE_CODE = "J10"; 
      const SCHOOL_CODE = "7531295";
      const API_KEY = "c18f1a26d702434190cb89c02059345c";

      function App() {
        const [meals, setMeals] = useState([]);
        const [loading, setLoading] = useState(true);
        const [selectedDate, setSelectedDate] = useState(new Date());

        useEffect(() => {
          fetchMealData(selectedDate);
        }, [selectedDate]);

        const fetchMealData = async (date) => {
          setLoading(true);
          const year = date.getFullYear();
          const month = String(date.getMonth() + 1).padStart(2, '0');
          const day = String(date.getDate()).padStart(2, '0');
          const yyyymmdd = `${year}${month}${day}`;

          try {
            // 1. 나이스 공식 API 직접 요청
            const res = await fetch(
              `https://open.neis.go.kr/hub/mealServiceDietInfo?KEY=${API_KEY}&Type=json&ATPT_OFCDC_SC_CODE=${OFFICE_CODE}&SD_SCHUL_CODE=${SCHOOL_CODE}&MLSV_YMD=${yyyymmdd}`
            );
            const data = await res.json();

            if (data.mealServiceDietInfo && data.mealServiceDietInfo[1]?.row) {
              setMeals(data.mealServiceDietInfo[1].row);
            } else {
              // 2. 만약 CORS 나 나이스 반환 오류 시 예비 공공 미러 API 호출
              const backupRes = await fetch(
                `https://meal.vbal.dev/api/meal?office=${OFFICE_CODE}&school=${SCHOOL_CODE}&date=${yyyymmdd}`
              );
              const backupData = await backupRes.json();
              if (backupData && backupData.meals) {
                setMeals(backupData.meals);
              } else {
                setMeals([]);
              }
            }
          } catch (err) {
            // 네트워크 우회 처리
            try {
              const backupRes = await fetch(
                `https://meal.vbal.dev/api/meal?office=${OFFICE_CODE}&school=${SCHOOL_CODE}&date=${yyyymmdd}`
              );
              const backupData = await backupRes.json();
              if (backupData && backupData.meals) {
                setMeals(backupData.meals);
              } else {
                setMeals([]);
              }
            } catch (e) {
              setMeals([]);
            }
          } finally {
            setLoading(false);
          }
        };

        const changeDate = (days) => {
          const newDate = new Date(selectedDate);
          newDate.setDate(newDate.getDate() + days);
          setSelectedDate(newDate);
        };

        const formatDateStr = (d) => {
          const year = d.getFullYear();
          const month = d.getMonth() + 1;
          const date = d.getDate();
          const dayNames = ['일', '월', '화', '수', '목', '금', '토'];
          const day = dayNames[d.getDay()];
          return `${year}년 ${month}월 ${date}일 (${day})`;
        };

        const cleanMealName = (mealStr) => {
          if (!mealStr) return null;
          return mealStr.split('<br/>').map((item, i) => (
            <div key={i} className="py-2 border-b border-slate-100 last:border-none flex justify-between items-center">
              <span className="text-base font-bold text-slate-800">
                {item.replace(/\([0-9.]+\)/g, '').trim()}
              </span>
            </div>
          ));
        };

        const isToday = selectedDate.toDateString() === new Date().toDateString();

        return (
          <div className="min-h-screen flex flex-col items-center justify-start pt-8 px-4">
            <div className="w-full max-w-md">
              
              {/* 타이틀 */}
              <div className="text-center mb-6">
                <span className="text-4xl mb-2 block">🍱</span>
                <h1 className="text-2xl font-black text-indigo-900 tracking-tight">{SCHOOL_NAME}</h1>
                <p className="text-xs text-slate-500 font-semibold mt-1">오늘의 급식 메뉴</p>
              </div>

              {/* 날짜 선택바 */}
              <div className="flex justify-between items-center bg-white p-3.5 rounded-2xl shadow-sm border border-slate-200 mb-4">
                <button
                  onClick={() => changeDate(-1)}
                  className="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold transition"
                >
                  ◀ 이전날
                </button>
                <span className="text-sm font-black text-indigo-600">
                  {formatDateStr(selectedDate)}
                </span>
                <button
                  onClick={() => changeDate(1)}
                  className="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold transition"
                >
                  다음날 ▶
                </button>
              </div>

              {!isToday && (
                <div className="text-center mb-4">
                  <button
                    onClick={() => setSelectedDate(new Date())}
                    className="text-xs text-indigo-600 hover:underline font-bold"
                  >
                    오늘 날짜로 돌아가기
                  </button>
                </div>
              )}

              {/* 급식 카드 영역 */}
              {loading ? (
                <div className="bg-white p-12 rounded-3xl shadow-sm text-center text-slate-400 text-sm font-medium">
                  중앙예닮학교 급식 정보를 불러오는 중...
                </div>
              ) : meals.length > 0 ? (
                <div className="space-y-4">
                  {meals.map((meal, idx) => (
                    <div key={idx} className="bg-white p-6 rounded-3xl shadow-md border border-slate-100">
                      <div className="flex justify-between items-center mb-4 pb-3 border-b border-slate-200">
                        <span className="bg-indigo-600 text-white font-bold text-xs px-3 py-1 rounded-full">
                          {meal.MMEAL_SC_NM || meal.mealName}
                        </span>
                        <span className="text-xs text-slate-400 font-semibold">{meal.CAL_INFO || meal.calorie}</span>
                      </div>

                      <div className="space-y-1">
                        {cleanMealName(meal.DDISH_NM || meal.menu)}
                      </div>
                    </div>
                  ))}
                </div>
              ) : (
                <div className="bg-white p-10 rounded-3xl shadow-sm border border-slate-200 text-center">
                  <p className="text-3xl mb-2">🍃</p>
                  <p className="text-sm font-bold text-slate-700">등록된 급식이 없습니다.</p>
                  <p className="text-xs text-slate-400 mt-1">주말, 공휴일 또는 방학 기간일 수 있습니다.</p>
                </div>
              )}

            </div>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
