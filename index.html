<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>중앙예닮학교 오늘의 급식</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & React DOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel Standalone -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body class="bg-slate-100 text-slate-800 font-sans pb-16 antialiased">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect } = React;

      const SCHOOL_NAME = "중앙예닮학교";

      // 최신 주간 식단 데이터 세트
      const MEAL_DATABASE = {
        "2026-08-24": [
          { type: "조식", cal: "606.7 Kcal", menu: ["백미밥", "몽글계란국", "라구소스미트볼", "오이무침", "어묵볶음", "배추김치"] },
          { type: "중식", cal: "937.6 Kcal", menu: ["혼합잡곡밥", "미역냉국", "브로콜리땅콩소스", "김치제육*온두부", "깍두기", "앙꼬절편"] },
          { type: "석식", cal: "958.8 Kcal", menu: ["추가밥", "매운크림짬뽕", "꿀감자치즈롤까스", "배추김치", "오복지무침", "생과일"] }
        ],
        "2026-08-25": [
          { type: "조식", cal: "884.8 Kcal", menu: ["야채볶음밥", "베이글*크림치즈", "크림스프", "볶음김치", "고감콘*소스", "사랑해사과c주스"] },
          { type: "중식", cal: "720.6 Kcal", menu: ["현미밥", "배추국", "훈제오리야채볶음", "건파래자반", "쌈무*소스", "깍두기"] },
          { type: "석식", cal: "801.0 Kcal", menu: ["혼합잡곡밥", "애호박찌개", "무말랭이무침", "치즈찜닭", "나초샐러드", "배추김치"] }
        ],
        "2026-08-26": [
          { type: "조식", cal: "822.6 Kcal", menu: ["백미밥", "김치찌개", "오이무침", "하트미니카츠", "삼치엿장조림", "배추김치"] },
          { type: "중식", cal: "740.5 Kcal", menu: ["산채비빔밥", "아욱된장국", "참나물오리엔탈무침", "셀프치킨또띠아", "파인애플", "배추김치"] },
          { type: "석식", cal: "799.8 Kcal", menu: ["귀리밥", "콩나물국", "매운돼지갈비찜", "미역줄기볶음", "오징어볼", "배추김치"] }
        ],
        "2026-08-27": [
          { type: "조식", cal: "647.9 Kcal", menu: ["미니밥", "핫케이크*시럽", "베이컨구이", "브로콜리갈릭오븐구이", "에너지바", "배추김치"] },
          { type: "중식", cal: "595.2 Kcal", menu: ["혼합잡곡밥", "소고기샤브샤브*2가지소스", "계란찜", "다시마무채무침", "대구까스*치폴레소스", "배추김치"] },
          { type: "석식", cal: "670.9 Kcal", menu: ["스팸밥버거", "미소국", "매콤꼬치어묵", "블루베리샐러드", "짜요짜요", "깍두기"] }
        ],
        "2026-08-28": [
          { type: "조식", cal: "671.5 Kcal", menu: ["백미밥", "사골떡국", "닭살소금구이", "연두부냉채", "생과일", "배추김치"] },
          { type: "중식", cal: "745.2 Kcal", menu: ["투움바파스타", "오지치즈후라이", "목살스테이크", "야채피클", "청포도에이드", "미니부시맨빵*초코잼"] },
          { type: "석식", cal: "792.0 Kcal", menu: ["백미밥", "등뼈감자탕&수제비", "오이고추무침", "멘치까스", "해물파전", "석박지"] }
        ]
      };

      function App() {
        const [selectedDate, setSelectedDate] = useState(new Date());
        const [meals, setMeals] = useState([]);

        useEffect(() => {
          const year = selectedDate.getFullYear();
          const month = String(selectedDate.getMonth() + 1).padStart(2, '0');
          const day = String(selectedDate.getDate()).padStart(2, '0');
          const dateKey = `${year}-${month}-${day}`;

          if (MEAL_DATABASE[dateKey]) {
            setMeals(MEAL_DATABASE[dateKey]);
          } else {
            setMeals([]);
          }
        }, [selectedDate]);

        const changeDate = (days) => {
          const newDate = new Date(selectedDate);
          newDate.setDate(newDate.getDate() + days);
          setSelectedDate(newDate);
        };

        const formatDateStr = (d) => {
          const year = d.getFullYear();
          const month = d.getMonth() + 1;
          const date = d.getDate();
          const dayNames = ['일', '월', '화', '수', '목', '금', '토'];
          const day = dayNames[d.getDay()];
          return `${year}년 ${month}월 ${date}일 (${day})`;
        };

        const isToday = selectedDate.toDateString() === new Date().toDateString();

        return (
          <div className="min-h-screen flex flex-col items-center justify-start pt-8 px-4">
            <div className="w-full max-w-md">
              
              {/* 학교 타이틀 */}
              <div className="text-center mb-6">
                <span className="text-4xl mb-2 block">🍱</span>
                <h1 className="text-2xl font-black text-indigo-900 tracking-tight">{SCHOOL_NAME}</h1>
                <p className="text-xs text-slate-500 font-semibold mt-1">오늘의 급식 메뉴</p>
              </div>

              {/* 날짜 선택바 */}
              <div className="flex justify-between items-center bg-white p-3.5 rounded-2xl shadow-sm border border-slate-200 mb-4">
                <button
                  onClick={() => changeDate(-1)}
                  className="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold transition"
                >
                  ◀ 이전날
                </button>
                <span className="text-sm font-black text-indigo-600">
                  {formatDateStr(selectedDate)}
                </span>
                <button
                  onClick={() => changeDate(1)}
                  className="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold transition"
                >
                  다음날 ▶
                </button>
              </div>

              {!isToday && (
                <div className="text-center mb-4">
                  <button
                    onClick={() => setSelectedDate(new Date())}
                    className="text-xs text-indigo-600 hover:underline font-bold"
                  >
                    오늘 날짜로 돌아가기
                  </button>
                </div>
              )}

              {/* 급식 목록 카드 */}
              {meals.length > 0 ? (
                <div className="space-y-4">
                  {meals.map((meal, idx) => (
                    <div key={idx} className="bg-white p-6 rounded-3xl shadow-md border border-slate-100">
                      <div className="flex justify-between items-center mb-4 pb-3 border-b border-slate-200">
                        <span className="bg-indigo-600 text-white font-bold text-xs px-3 py-1 rounded-full">
                          {meal.type}
                        </span>
                        <span className="text-xs text-slate-400 font-semibold">{meal.cal}</span>
                      </div>

                      <div className="space-y-1">
                        {meal.menu.map((item, i) => (
                          <div key={i} className="py-2 border-b border-slate-100 last:border-none flex justify-between items-center">
                            <span className="text-base font-bold text-slate-800">
                              {item}
                            </span>
                          </div>
                        ))}
                      </div>
                    </div>
                  ))}
                </div>
              ) : (
                <div className="bg-white p-10 rounded-3xl shadow-sm border border-slate-200 text-center">
                  <p className="text-3xl mb-2">🍃</p>
                  <p className="text-sm font-bold text-slate-700">등록된 급식이 없습니다.</p>
                  <p className="text-xs text-slate-400 mt-1">주말, 공휴일 또는 방학 기간일 수 있습니다.</p>
                </div>
              )}

            </div>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
