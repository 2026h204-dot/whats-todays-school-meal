<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>오늘의 학교 급식</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & React DOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel Standalone -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body class="bg-slate-50 text-slate-800 font-sans pb-16 antialiased">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect } = React;

      // 나이스 API 인증키 (공공 오픈키)
      const API_KEY = "c18f1a26d702434190cb89c02059345c"; 

      function App() {
        const [searchQuery, setSearchQuery] = useState('');
        const [searchResults, setSearchResults] = useState([]);
        const [selectedSchool, setSelectedSchool] = useState(() => {
          const saved = localStorage.getItem('my_school');
          return saved ? JSON.parse(saved) : null;
        });
        const [meals, setMeals] = useState([]);
        const [loading, setLoading] = useState(false);
        const [selectedDate, setSelectedDate] = useState(new Date());

        // 로컬스토리지에 학교 정보 저장
        useEffect(() => {
          if (selectedSchool) {
            localStorage.setItem('my_school', JSON.stringify(selectedSchool));
            fetchMealData(selectedSchool, selectedDate);
          }
        }, [selectedSchool, selectedDate]);

        // 학교 검색
        const handleSearchSchool = async (e) => {
          e.preventDefault();
          if (!searchQuery.trim()) return;

          setLoading(true);
          try {
            const res = await fetch(
              `https://open.neis.go.kr/hub/schoolInfo?KEY=${API_KEY}&Type=json&pIndex=1&pSize=10&SCHUL_NM=${encodeURIComponent(searchQuery)}`
            );
            const data = await res.json();
            if (data.schoolInfo) {
              setSearchResults(data.schoolInfo[1].row);
            } else {
              alert('검색 결과가 없습니다.');
              setSearchResults([]);
            }
          } catch (err) {
            alert('학교 검색 중 오류가 발생했습니다.');
          } finally {
            setLoading(false);
          }
        };

        // 급식 정보 조회
        const fetchMealData = async (school, date) => {
          setLoading(true);
          const yyyymmdd = date.toISOString().slice(0, 10).replace(/-/g, '');

          try {
            const res = await fetch(
              `https://open.neis.go.kr/hub/mealServiceDietInfo?KEY=${API_KEY}&Type=json&ATPT_OFCDC_SC_CODE=${school.ATPT_OFCDC_SC_CODE}&SD_SCHUL_CODE=${school.SD_SCHUL_CODE}&MLSV_YMD=${yyyymmdd}`
            );
            const data = await res.json();

            if (data.mealServiceDietInfo) {
              setMeals(data.mealServiceDietInfo[1].row);
            } else {
              setMeals([]);
            }
          } catch (err) {
            setMeals([]);
          } finally {
            setLoading(false);
          }
        };

        // 날짜 이동
        const changeDate = (days) => {
          const newDate = new Date(selectedDate);
          newDate.setDate(newDate.getDate() + days);
          setSelectedDate(newDate);
        };

        const formatDateStr = (d) => {
          const year = d.getFullYear();
          const month = d.getMonth() + 1;
          const date = d.getDate();
          const dayNames = ['일', '월', '화', '수', '목', '금', '토'];
          const day = dayNames[d.getDay()];
          return `${year}년 ${month}월 ${date}일 (${day})`;
        };

        // 급식 메뉴 텍스트 정화 (알레르기 번호 제거 옵션)
        const cleanMealName = (mealStr) => {
          return mealStr.replace(/<br\/>/g, '\n').replace(/\([0-9.]+\)/g, '');
        };

        return (
          <div className="min-h-screen">
            {/* 헤더 */}
            <header className="bg-white border-b border-slate-200 sticky top-0 z-30">
              <div className="max-w-md mx-auto px-5 h-16 flex justify-between items-center">
                <div className="flex items-center space-x-2">
                  <span className="text-xl">🍱</span>
                  <h1 className="text-base font-bold text-slate-900">오늘의 급식</h1>
                </div>
                {selectedSchool && (
                  <button
                    onClick={() => { setSelectedSchool(null); setSearchResults([]); }}
                    className="text-xs text-indigo-600 bg-indigo-50 hover:bg-indigo-100 px-2.5 py-1.5 rounded-lg transition font-medium"
                  >
                    학교 변경
                  </button>
                )}
              </div>
            </header>

            <main className="max-w-md mx-auto px-5 mt-6">
              {/* 학교 선택 안 됨 -> 검색 화면 */}
              {!selectedSchool ? (
                <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                  <h2 className="text-base font-bold text-slate-900 mb-1">우리 학교 찾기</h2>
                  <p className="text-xs text-slate-500 mb-4">급식을 조회할 학교 이름을 입력해 주세요.</p>

                  <form onSubmit={handleSearchSchool} className="flex gap-2 mb-4">
                    <input
                      type="text"
                      placeholder="예: 경기고등학교"
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                      className="flex-1 text-xs border border-slate-200 rounded-xl px-3.5 py-2.5 focus:outline-none focus:border-indigo-600"
                    />
                    <button
                      type="submit"
                      className="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold px-4 py-2.5 rounded-xl transition"
                    >
                      검색
                    </button>
                  </form>

                  {/* 검색 결과 목록 */}
                  {searchResults.length > 0 && (
                    <div className="space-y-2 max-h-60 overflow-y-auto border-t border-slate-100 pt-3">
                      {searchResults.map((item) => (
                        <div
                          key={item.SD_SCHUL_CODE}
                          onClick={() => setSelectedSchool(item)}
                          className="p-3 bg-slate-50 hover:bg-indigo-50 border border-slate-100 rounded-xl cursor-pointer transition text-left"
                        >
                          <p className="font-semibold text-xs text-slate-800">{item.SCHUL_NM}</p>
                          <p className="text-[11px] text-slate-400 mt-0.5">{item.ORG_RDNMA}</p>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              ) : (
                /* 급식 표시 화면 */
                <div>
                  {/* 선택된 학교 표시 */}
                  <div className="mb-4 text-center">
                    <span className="text-xs font-semibold text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full">
                      {selectedSchool.SCHUL_NM}
                    </span>
                  </div>

                  {/* 날짜 선택 네비게이션 */}
                  <div className="flex justify-between items-center bg-white p-3 rounded-2xl border border-slate-200 shadow-sm mb-5">
                    <button
                      onClick={() => changeDate(-1)}
                      className="p-2 text-slate-600 hover:bg-slate-100 rounded-xl text-xs font-bold transition"
                    >
                      ◀ 이전날
                    </button>
                    <span className="text-xs font-bold text-slate-800">
                      {formatDateStr(selectedDate)}
                    </span>
                    <button
                      onClick={() => changeDate(1)}
                      className="p-2 text-slate-600 hover:bg-slate-100 rounded-xl text-xs font-bold transition"
                    >
                      다음날 ▶
                    </button>
                  </div>

                  {/* 오늘 날짜로 복귀 버튼 */}
                  {selectedDate.toDateString() !== new Date().toDateString() && (
                    <div className="text-center mb-4">
                      <button
                        onClick={() => setSelectedDate(new Date())}
                        className="text-xs text-indigo-600 underline font-medium"
                      >
                        오늘 날짜로 돌아가기
                      </button>
                    </div>
                  )}

                  {/* 급식 목록 */}
                  {loading ? (
                    <div className="text-center py-12 text-xs text-slate-400">급식 정보를 불러오는 중...</div>
                  ) : meals.length > 0 ? (
                    <div className="space-y-4">
                      {meals.map((meal, idx) => (
                        <div key={idx} className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                          <div className="flex justify-between items-center mb-3 pb-2 border-b border-slate-100">
                            <span className="font-bold text-xs text-slate-900">{meal.MMEAL_SC_NM}</span>
                            <span className="text-[11px] text-slate-400 font-medium">{meal.CAL_INFO}</span>
                          </div>

                          <div className="whitespace-pre-line text-xs leading-relaxed text-slate-700 font-medium">
                            {cleanMealName(meal.DDISH_NM)}
                          </div>
                        </div>
                      ))}
                    </div>
                  ) : (
                    <div className="bg-white p-8 rounded-2xl border border-slate-200 text-center text-slate-400 text-xs shadow-sm">
                      🍃 등록된 급식 정보가 없습니다. <br/>(주말, 공휴일 또는 방학일 수 있습니다)
                    </div>
                  )}
                </div>
              )}
            </main>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
